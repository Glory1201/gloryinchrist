<button onclick="playArticle()" style="background:#fff;color:#000;padding:10px 16px;border-radius:6px;border:none;cursor:pointer;font-weight:bold;margin-bottom:20px;">
  ▶ Play Audio
</button>

<button onclick="pauseAudio()" style="background:#fff;color:#000;padding:10px 16px;border-radius:6px;border:none;cursor:pointer;font-weight:bold;margin-bottom:20px;">
  ⏸ Pause
</button>

<button onclick="resumeAudio()" style="background:#fff;color:#000;padding:10px 16px;border-radius:6px;border:none;cursor:pointer;font-weight:bold;margin-bottom:20px;">
  ▶ Resume
</button>

<script>
let utterance;
let voices = [];

function loadVoices() {
  voices = speechSynthesis.getVoices();
}

speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function getFemaleUKVoice() {
  return voices.find(v =>
    v.lang === "en-GB" &&
    (
      v.name.includes("Female") ||
      v.name.includes("Google") ||
      v.name.includes("Serena") ||
      v.name.includes("Hazel") ||
      v.name.includes("Samantha")
    )
  );
}

function playArticle() {
  const content = document.getElementById("post-content").innerText;
  utterance = new SpeechSynthesisUtterance(content);

  const femaleVoice = getFemaleUKVoice();

  if (femaleVoice) {
    utterance.voice = femaleVoice;
  } else {
    utterance.lang = "en-GB";
  }

  speechSynthesis.speak(utterance);
}

function pauseAudio() {
  if (speechSynthesis.speaking && !speechSynthesis.paused) {
    speechSynthesis.pause();
  }
}

function resumeAudio() {
  if (speechSynthesis.paused) {
    speechSynthesis.resume();
  }
}
</script>
